<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King of Math | صفحة الطالب</title>
<meta name="theme-color" content="#0b0c16">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c16;--bg-soft:#0f1120;--card:#151729;--card-2:#1a1c33;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.12);
  --text:#eef0fb;--text-dim:#9294ad;--text-dim-2:#6b6d84;
  --purple:#8b6bff;--purple-2:#6d4fe0;--cyan:#22d3ee;
  --green:#22c55e;--green-bg:rgba(34,197,94,.14);
  --amber:#f2b134;--amber-bg:rgba(242,177,52,.14);
  --red:#f4415e;--red-bg:rgba(244,65,94,.14);
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 90% -10%, rgba(139,107,255,.10), transparent 60%),
    radial-gradient(1000px 500px at 0% 0%, rgba(34,211,238,.06), transparent 55%), var(--bg);
  color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;
}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;
  border-radius:12px;padding:11px 16px;display:inline-flex;align-items:center;gap:8px;
  transition:transform .15s ease, filter .15s ease;white-space:nowrap;}
.btn:hover{filter:brightness(1.12);}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;box-shadow:0 6px 18px -6px rgba(139,107,255,.55);}
.btn-outline{background:var(--card);border:1px solid var(--border-2);color:var(--text);}

/* ---------- Login ---------- */
.login-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border-2);
  border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6);}
.login-card .badge{width:58px;height:58px;border-radius:16px;margin:0 auto;
  background:linear-gradient(135deg,var(--purple),#5561e6);display:flex;align-items:center;justify-content:center;font-size:26px;}
.login-card h2{margin:0;font-size:19px;font-weight:900;text-align:center;}
.login-card p{margin:0;font-size:12.5px;color:var(--text-dim-2);text-align:center;}
.login-card input{width:100%;background:var(--bg-soft);border:1px solid var(--border-2);border-radius:11px;
  padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;}
.login-card input:focus{outline:none;border-color:var(--purple);}
.login-error{color:var(--red);font-size:12.5px;font-weight:700;text-align:center;min-height:16px;}

/* ---------- App ---------- */
.app{max-width:640px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:16px;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-badge{width:44px;height:44px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--purple),#5561e6);
  display:flex;align-items:center;justify-content:center;font-size:20px;}
.brand h1{margin:0;font-size:16px;font-weight:900;}
.brand p{margin:2px 0 0;font-size:12px;color:var(--text-dim-2);}

.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:4px;gap:4px;}
.tabs button{flex:1;border:none;background:transparent;color:var(--text-dim);font-family:inherit;font-weight:800;
  font-size:13px;padding:10px;border-radius:9px;cursor:pointer;}
.tabs button.active{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.grade-hero{display:flex;align-items:center;gap:16px;}
.donut{width:84px;height:84px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.donut-inner{width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-inner b{font-size:16px;font-weight:900;}
.donut-inner span{font-size:9px;color:var(--text-dim-2);}
.grade-hero h2{margin:0;font-size:17px;font-weight:900;}
.grade-hero p{margin:4px 0 0;font-size:12.5px;color:var(--text-dim-2);}
.level-badge{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:800;}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-mini{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat-mini b{display:block;font-size:19px;font-weight:900;}
.stat-mini span{font-size:11px;color:var(--text-dim-2);font-weight:700;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;}
.info-grid .k{color:var(--text-dim-2);}
.info-grid .v{font-weight:700;}

/* ---------- Chat ---------- */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:420px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-empty{margin:auto;color:var(--text-dim-2);font-size:13px;}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;word-break:break-word;}
.msg-in{align-self:flex-start;background:var(--bg-soft);border:1px solid var(--border-2);border-bottom-left-radius:4px;}
.msg-out{align-self:flex-end;background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;border-bottom-right-radius:4px;}
.msg-time{display:block;margin-top:4px;font-size:10.5px;opacity:.65;}
.chat-input-row{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);}
.chat-input-row textarea{flex:1;resize:none;background:var(--bg-soft);border:1px solid var(--border-2);border-radius:12px;
  padding:11px 14px;color:var(--text);font-family:inherit;font-size:13.5px;min-height:44px;max-height:120px;}
.chat-input-row textarea:focus{outline:none;border-color:var(--purple);}
.chat-note{font-size:11.5px;color:var(--text-dim-2);text-align:center;padding:8px 0 0;}
</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="badge">👑</div>
    <h2>King of Math</h2>
    <p>ادخل بكود الدخول والاسم اللي معاك من المستر</p>
    <form id="studentLoginForm" style="display:flex;flex-direction:column;gap:12px;">
      <input type="text" id="loginCode" placeholder="كود الدخول" required inputmode="numeric">
      <input type="text" id="loginName" placeholder="اسمك بالكامل" required>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;" id="loginSubmit">دخول</button>
    </form>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">👑</div>
      <div>
        <h1>King of Math</h1>
        <p id="welcomeText">أهلاً بيك</p>
      </div>
    </div>
    <button class="btn btn-outline" id="logoutBtn">خروج</button>
  </div>

  <div class="tabs">
    <button id="tabGradesBtn" class="active">درجاتي</button>
    <button id="tabPublicBtn">الإعلانات</button>
    <button id="tabPrivateBtn">شات المستر</button>
  </div>

  <div id="gradesView">
    <div class="card grade-hero">
      <div class="donut" id="donut"><div class="donut-inner"><b id="pctText">0%</b><span>النسبة</span></div></div>
      <div>
        <h2 id="scoreText">0 / 100</h2>
        <p id="groupText">-</p>
        <span class="level-badge" id="levelBadge">-</span>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="stats-row">
        <div class="stat-mini"><b id="improveText">0%</b><span>نسبة التحسّن</span></div>
        <div class="stat-mini"><b id="commitText">0%</b><span>الالتزام بالواجبات</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="info-grid">
        <span class="k">المدرسة</span><span class="v" id="schoolText">-</span>
        <span class="k">الصف الدراسي</span><span class="v" id="gradeText">-</span>
        <span class="k">المحافظة</span><span class="v" id="cityText">-</span>
        <span class="k">الفصل</span><span class="v" id="classText">-</span>
      </div>
    </div>
  </div>

  <div id="publicView" style="display:none;">
    <div class="chat-wrap">
      <div class="chat-body" id="publicBody"><div class="chat-empty">لسه مفيش إعلانات</div></div>
      <div class="chat-note">الإعلانات من المستر بس — مينفعش الطالب يبعت هنا</div>
    </div>
  </div>

  <div id="privateView" style="display:none;">
    <div class="chat-wrap">
      <div class="chat-body" id="privateBody"><div class="chat-empty">ابعت رسالتك الأولى للمستر</div></div>
      <div class="chat-input-row">
        <textarea id="privateInput" placeholder="اكتب رسالتك للمستر..." rows="1"></textarea>
        <button class="btn btn-primary" id="privateSendBtn">إرسال</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="messaging.js" defer></script>
<script defer>
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(iso){
  try{ return new Date(iso).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function pct(s){ return s.examTotal ? Math.round((s.examScore/s.examTotal)*100) : 0; }
function levelOf(p){
  if(p>=90) return {text:'ممتاز', color:'var(--green)', bg:'var(--green-bg)'};
  if(p>=75) return {text:'جيد', color:'var(--cyan)', bg:'rgba(34,211,238,.14)'};
  if(p>=60) return {text:'متوسط', color:'var(--amber)', bg:'var(--amber-bg)'};
  return {text:'يحتاج متابعة', color:'var(--red)', bg:'var(--red-bg)'};
}

function renderGrades(s){
  const p = pct(s);
  const lvl = levelOf(p);
  document.getElementById('pctText').textContent = p+'%';
  document.getElementById('donut').style.background =
    `conic-gradient(${lvl.color} ${p*3.6}deg, var(--bg-soft) 0deg)`;
  document.getElementById('scoreText').textContent = `${s.examScore} / ${s.examTotal}`;
  document.getElementById('groupText').textContent = s.group || '-';
  const badge = document.getElementById('levelBadge');
  badge.textContent = lvl.text;
  badge.style.color = lvl.color; badge.style.background = lvl.bg;
  document.getElementById('improveText').textContent = (s.improvement>=0?'+':'')+s.improvement+'%';
  document.getElementById('commitText').textContent = s.commitment+'%';
  document.getElementById('schoolText').textContent = s.school || '-';
  document.getElementById('gradeText').textContent = s.grade || '-';
  document.getElementById('cityText').textContent = s.city || '-';
  document.getElementById('classText').textContent = s.classId ? 'متصنّف' : 'غير مصنّف';
  document.getElementById('welcomeText').textContent = 'أهلاً بيك، ' + s.name;
}

function appendBubble(containerId, msg, mineRole){
  const body = document.getElementById(containerId);
  const empty = body.querySelector('.chat-empty');
  if(empty) empty.remove();
  const mine = msg.sender === mineRole;
  const div = document.createElement('div');
  div.className = `msg-bubble ${mine?'msg-out':'msg-in'}`;
  div.innerHTML = `${escapeHtml(msg.body)}<span class="msg-time">${fmtTime(msg.created_at)}</span>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function setTab(tab){
  document.getElementById('tabGradesBtn').classList.toggle('active', tab==='grades');
  document.getElementById('tabPublicBtn').classList.toggle('active', tab==='public');
  document.getElementById('tabPrivateBtn').classList.toggle('active', tab==='private');
  document.getElementById('gradesView').style.display = tab==='grades' ? '' : 'none';
  document.getElementById('publicView').style.display = tab==='public' ? '' : 'none';
  document.getElementById('privateView').style.display = tab==='private' ? '' : 'none';
}
document.getElementById('tabGradesBtn').addEventListener('click', ()=>setTab('grades'));
document.getElementById('tabPublicBtn').addEventListener('click', ()=>setTab('public'));
document.getElementById('tabPrivateBtn').addEventListener('click', ()=>setTab('private'));

async function loadPublicChat(){
  const body = document.getElementById('publicBody');
  try{
    const msgs = await KOM.fetchPublicMessages();
    body.innerHTML = '';
    if(!msgs.length) body.innerHTML = '<div class="chat-empty">لسه مفيش إعلانات</div>';
    msgs.forEach(m=>appendBubble('publicBody', m, '__none__'));
  }catch(e){ console.error(e); body.innerHTML = '<div class="chat-empty">تعذر تحميل الإعلانات</div>'; }
  KOM.subscribePublicChat((m)=>appendBubble('publicBody', m, '__none__'));
}

async function loadPrivateChat(studentId){
  const body = document.getElementById('privateBody');
  try{
    const msgs = await KOM.fetchPrivateMessages(studentId);
    body.innerHTML = '';
    if(!msgs.length) body.innerHTML = '<div class="chat-empty">ابعت رسالتك الأولى للمستر</div>';
    msgs.forEach(m=>appendBubble('privateBody', m, 'student'));
  }catch(e){ console.error(e); body.innerHTML = '<div class="chat-empty">تعذر تحميل الرسايل</div>'; }
  KOM.subscribePrivateChat(studentId, (m)=>appendBubble('privateBody', m, 'student'));
}

async function sendPrivate(){
  const input = document.getElementById('privateInput');
  const body = input.value.trim();
  if(!body || !KOM.currentStudent) return;
  const btn = document.getElementById('privateSendBtn');
  btn.disabled = true;
  try{
    await KOM.sendPrivateMessage(KOM.currentStudent.id, body, 'student');
    input.value = '';
  }catch(e){ console.error(e); alert('تعذر إرسال الرسالة'); }
  finally{ btn.disabled = false; input.focus(); }
}
document.getElementById('privateSendBtn').addEventListener('click', sendPrivate);
document.getElementById('privateInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendPrivate(); }
});

async function bootStudentApp(student){
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  renderGrades(student);
  loadPublicChat();
  loadPrivateChat(student.id);
  KOM.subscribeStudentUpdates(student.id, (updated)=>{
    KOM.currentStudent = updated;
    renderGrades(updated);
  });
}

document.getElementById('studentLoginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const code = document.getElementById('loginCode').value;
  const name = document.getElementById('loginName').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginSubmit');
  errBox.textContent = '';
  btn.disabled = true;
  try{
    const student = await KOM.studentLogin(code, name);
    await bootStudentApp(student);
  }catch(err){
    console.error(err);
    errBox.textContent = 'الكود أو الاسم مش مطابق، تأكد منهم مع المستر';
  }finally{ btn.disabled = false; }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  KOM.unsubscribeAll();
  await KOM.logout();
  location.reload();
});

(async function init(){
  const student = await KOM.tryAutoLogin();
  if(student) await bootStudentApp(student);
})();
</script>
</body>
</html>
